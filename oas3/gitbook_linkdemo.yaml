openapi: 3.1.0
servers: [url: https://127.0.0.1:8904]
security: [ ]

x-expandAllModelSections: true

x-common-blocks:
  - &MARKDOWN |

    Gitbook does not currently render anything before an H1 in the introduction's description.  It
    does everywhere else (tags, operations, schemas).  Not showing it in the intro isn't a big deal
    for us as the consensus is to never use H1 headings anyway.

    ## Heading1
   
    Experiment with heading levels while we are at it.  Gitbook does not always render text that
    precedes an H1.  H2s become their own page and ∴ get an entry in the ToC.  H3s and below go into
    their higher-level heading's page.

    This markdown is duplicated in:
      * The introduction to the API,
      * the description of the tag "Tag One",
      * the description of the path "Sample path",
      * the model "schema1",
      * the field called "firstField" in schema, and
      * the 200 and 400 results of the "Sample path" path.

    Ideally all of the links following this para would be active, but experiments like this one show
    that:

    * Links that are in the description of the intro, a tag, or a path, must be fully-qualified,
      right from the "https://".  Anything other kind of link in such a description, including those
      that start with a slash, are deactivated.  Deactivated means that "`[this](that)`" ends up as
      simply "this".

      Which means the only way to put links in the descriptions of tags and the intro is to start
      them with `https://help.security.gallagher.com/knowledge-hub/…`.

    * Links in the description of a schema (model) will make it into the book unscathed.

    * All kinds of links in the description of the securitySchemes component make it in.

    * Since the "schemas" and "securitySchemes" are safe I'd guess that links in the other kinds of
      component -- examples, requestBodies, responses, and parameters -- will survive.  But that's
      just a guess, and gitbook is under active development, so no bets.

    I'd like all of these to be active links, no matter where in the document they are, but Gitbook
    only makes the first one active everywhere and only makes the rest active inside a schema.

    * [https://help.security.gallagher.com/](https://help.security.gallagher.com/)
    * To the root of this server:  [/](/)
    * To "Heading2" in the intro's description:  [heading2](heading2)
    * Same thing but with `./` [./heading2](./heading2)
    * To "Heading2" in the tag's description:  [tag-one#heading2](tag-one#heading2)
    * To the tag:  [tag-one](tag-one)
    * To the "sample path" operation:  [tag-one#get-api](tag-one#get-api)
    * To the "schema1" model:  [models#schema1](models#schema1)

    ## Heading2

    Heading 2 body.  Same indentation level in the navbar as all the other pages including an H1,
    the tags, and the models.

    ### Heading3
    H3 body.  Goes onto the same page as its H2, and does not get a ToC entry.

info:
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: "v1"
  title: Checking Gitbook's handling of links in Markdown.
  description: *MARKDOWN

components:
  schemas:
    schema1:
      title: Schema one title
      description: *MARKDOWN
      type: object
      properties:
        firstField:
          type: string
          description: *MARKDOWN

tags:
- name: tag one
  summary: Tag one (contains the operation)
  x-page-icon: tag # to distinguish tags from every other heading in Gitbook
  description: *MARKDOWN
    
paths:
  /api:
    get:
      summary: Sample path
      operationId: oid
      tags: [ "tag one" ]
      description: *MARKDOWN
      responses:
        "200":
          description: *MARKDOWN
        "400":
          description: *MARKDOWN
